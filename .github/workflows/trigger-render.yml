# Render backend redeploy — RENDER_DEPLOY_HOOK_URL secret set karo; warna skip.
# Hook: Render → Service → Deploy → Deploy hook

name: Trigger Render deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ai/**'
      - 'automation/**'
      - 'docker/**'
      - 'render.yaml'
      - '.github/workflows/trigger-render.yml'

jobs:
  hook:
    runs-on: ubuntu-latest

    steps:
      - name: POST deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret set karo (Render → Service → Deploy hook)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Render deploy triggered."
